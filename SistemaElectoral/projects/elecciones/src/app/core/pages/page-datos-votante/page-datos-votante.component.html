<div class="votante-page">
  <div class="votante-page-blob votante-page-blob--one"></div>
  <div class="votante-page-blob votante-page-blob--two"></div>

  <div class="votante-card">
    <header class="votante-header">
      <div class="votante-avatar" aria-hidden="true">{{ iniciales }}</div>
      <div class="votante-header-text">
        <h1 class="votante-title">{{ votante.nombre }}</h1>
        <p class="votante-subtitle">Información del padrón electoral</p>
      </div>
    </header>

    <dl class="votante-datos">
      <div class="dato">
        <dt>Nombre</dt>
        <dd id="dato-nombre">{{ votante.nombre }}</dd>
      </div>

      <div class="dato">
        <dt>Cédula</dt>
        <dd id="dato-cedula">{{ votante.cedula }}</dd>
      </div>

      <div class="dato">
        <dt>Recinto electoral</dt>
        <dd id="dato-recinto">{{ votante.recinto }}</dd>
      </div>

      <div class="dato">
        <dt>Mesa</dt>
        <dd id="dato-mesa">{{ votante.mesa }}</dd>
      </div>

      <div class="dato">
        <dt>Estado del voto</dt>
        <dd>
          <span
            class="estado-voto"
            id="dato-estado"
            [class.estado-voto--votado]="yaVoto"
            [class.estado-voto--pendiente]="!yaVoto">
            <span class="estado-voto-punto" aria-hidden="true"></span>
            {{ votante.estadoVoto }}
          </span>
        </dd>
      </div>
    </dl>

    <button type="button" class="votante-button" (click)="salir()">Cerrar sesión</button>
  </div>
</div>
